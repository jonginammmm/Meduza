<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistik Tabiiy Meduza</title>
  <style>
    * { margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010a15;
    }
    canvas { display: block; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

const mouse = { x: width / 2, y: height / 2 };
window.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener("touchmove", (e) => {
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }
});

class RealisticJellyfish {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 50;
    
    // Ingichka chetki paypaslagichlar
    this.tentacles = [];
    for (let i = 0; i < 24; i++) {
      let pts = [];
      for (let j = 0; j < 18; j++) {
        pts.push({ x: this.x, y: this.y });
      }
      this.tentacles.push(pts);
    }

    // Markaziy to'lqinsimon tutamlar (oral arms)
    this.innerArms = [];
    for (let i = 0; i < 4; i++) {
      let pts = [];
      for (let j = 0; j < 14; j++) {
        pts.push({ x: this.x, y: this.y });
      }
      this.innerArms.push(pts);
    }
  }

  update(time) {
    // Silliq inersiyali harakat
    this.x += (mouse.x - this.x) * 0.03;
    this.y += (mouse.y - this.y) * 0.03;

    // Tabiiy pulsatsiya (sirtning qisqarishi va kengayishi)
    const pulseCycle = Math.sin(time * 0.0025);
    const pulse = Math.pow(Math.max(0, pulseCycle), 2) * 12 - 4;
    const currentRadius = this.radius + pulse;

    // Chetki paypaslagichlarni hisoblash
    for (let i = 0; i < this.tentacles.length; i++) {
      const angle = ((i - (this.tentacles.length - 1) / 2) * 0.08);
      let headX = this.x + Math.sin(angle) * (currentRadius * 0.9);
      let headY = this.y + Math.cos(angle) * (currentRadius * 0.25) + currentRadius * 0.1;

      let pts = this.tentacles[i];
      pts[0].x = headX;
      pts[0].y = headY;

      for (let j = 1; j < pts.length; j++) {
        let prev = pts[j - 1];
        let curr = pts[j];
        let wave = Math.sin(time * 0.003 + j * 0.25 + i * 0.5) * (1.2 + j * 0.2);
        let dx = curr.x - prev.x;
        let dy = curr.y - prev.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0) {
          curr.x = prev.x + (dx / dist) * 8 + wave;
          curr.y = prev.y + (dy / dist) * 8 + 1.8;
        }
      }
    }

    // Ichki tutamlarni hisoblash
    for (let i = 0; i < this.innerArms.length; i++) {
      let offsetX = (i - 1.5) * 10;
      let pts = this.innerArms[i];
      pts[0].x = this.x + offsetX;
      pts[0].y = this.y + currentRadius * 0.2;

      for (let j = 1; j < pts.length; j++) {
        let prev = pts[j - 1];
        let curr = pts[j];
        let wave = Math.sin(time * 0.002 + j * 0.3 + i) * (3 + j * 0.5);
        let dx = curr.x - prev.x;
        let dy = curr.y - prev.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0) {
          curr.x = prev.x + (dx / dist) * 10 + wave * 0.2;
          curr.y = prev.y + (dy / dist) * 10 + 2;
        }
      }
    }

    this.draw(currentRadius);
  }

  draw(r) {
    // 1. Ichki yumshoq tutamlar
    for (let i = 0; i < this.innerArms.length; i++) {
      let pts = this.innerArms[i];
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);

      for (let j = 1; j < pts.length - 1; j++) {
        let xc = (pts[j].x + pts[j + 1].x) / 2;
        let yc = (pts[j].y + pts[j + 1].y) / 2;
        ctx.quadraticCurveTo(pts[j].x, pts[j].y, xc, yc);
      }

      ctx.strokeStyle = "rgba(180, 220, 240, 0.25)";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.restore();
    }

    // 2. Ingichka chetki toalalar
    for (let i = 0; i < this.tentacles.length; i++) {
      let pts = this.tentacles[i];
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);

      for (let j = 1; j < pts.length - 1; j++) {
        let xc = (pts[j].x + pts[j + 1].x) / 2;
        let yc = (pts[j].y + pts[j + 1].y) / 2;
        ctx.quadraticCurveTo(pts[j].x, pts[j].y, xc, yc);
      }

      ctx.strokeStyle = "rgba(220, 240, 255, 0.35)";
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.restore();
    }

    // 3. Organik Shaffof Kupol (Tana)
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, Math.PI * 0.9, Math.PI * 0.1, false);
    
    // Pastki burmali qismi
    ctx.quadraticCurveTo(this.x + r * 0.5, this.y + 18, this.x, this.y + 8);
    ctx.quadraticCurveTo(this.x - r * 0.5, this.y + 18, this.x - r * Math.cos(Math.PI * 0.1), this.y + Math.sin(Math.PI * 0.1) * r);

    // Tabiiy shaffof gradient
    let grad = ctx.createRadialGradient(this.x, this.y - r * 0.2, 2, this.x, this.y, r);
    grad.addColorStop(0, "rgba(230, 245, 255, 0.5)");
    grad.addColorStop(0.5, "rgba(120, 185, 220, 0.25)");
    grad.addColorStop(0.85, "rgba(60, 130, 180, 0.15)");
    grad.addColorStop(1, "rgba(20, 60, 100, 0.02)");

    ctx.fillStyle = grad;
    ctx.fill();

    // Mayin chegara konturi
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.stroke();
    ctx.restore();
  }
}

const jellyfish = new RealisticJellyfish(width / 2, height / 2);

function animate(time) {
  ctx.clearRect(0, 0, width, height);

  // Tabiiy chuqur suv foni
  let oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
  oceanGrad.addColorStop(0, "#031424");
  oceanGrad.addColorStop(1, "#00050a");
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, width, height);

  jellyfish.update(time);
  requestAnimationFrame(animate);
}

animate(0);
</script>
</body>
</html>
